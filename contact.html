<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Ayomide Oloruntade</title>
<meta name="description" content="Contact form to reach Ayomide Oloruntade, with client-side validation.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Ayomide <span>Oloruntade</span></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">☰ Menu</button>
    <nav class="main-nav" id="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Academic Planner</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <h1>Get in Touch</h1>
      <p class="muted">Have a question, an opportunity, or feedback on this site? Send a message below.</p>

      <div id="form-success" role="status"></div>

      <form id="contact-form" class="contact-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name">
          <span class="error" id="name-error"></span>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <span class="error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="Digits only, e.g. 08012345678">
          <span class="error" id="phone-error"></span>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
          <span class="error" id="message-error"></span>
        </div>

        <button type="submit" class="btn gold">Send message</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <p>&copy; <span id="year"></span> Ayomide Oloruntade. Built for COS 106 — Introduction to Web Technologies.</p>
    <p><a href="mailto:ayomideoloruntade9@gmail.com">ayomideoloruntade9@gmail.com</a></p>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
